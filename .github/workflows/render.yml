name: render

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [repos.json, render.mjs]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node render.mjs
        env:
          # PROFILE_TOKEN: fine-grained PAT with read access to the private org repos.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN }}
      - run: |
          git diff --quiet terminal.svg && exit 0
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add terminal.svg
          git commit -m 'chore: re-render terminal.svg'
          git push
